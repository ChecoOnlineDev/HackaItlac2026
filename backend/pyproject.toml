[project]
name = "backend"
version = "0.1.0"
description = "Backend para el track 3 del Hackaitlac2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0",
    "tzdata>=2025.2",
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
